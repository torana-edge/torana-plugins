name: Release plugin

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin directory name
        required: true
      version:
        description: Semver release version
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: torana-plugins
      - uses: actions/checkout@v4
        with:
          repository: torana-edge/torana-plugin-sdk
          ref: main
          path: torana-plugin-sdk
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - working-directory: torana-plugins
        run: ./scripts/test.sh
      - working-directory: torana-plugins
        run: ./scripts/package.sh '${{ inputs.plugin }}' '${{ inputs.version }}'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: '${{ inputs.plugin }}/v${{ inputs.version }}'
          files: torana-plugins/dist/${{ inputs.plugin }}/*
