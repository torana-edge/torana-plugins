name: Release plugin

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin directory name
        required: true
      version:
        description: Semver release version
        required: true

# Must match ci.yml. A release built against a different SDK than CI validated
# is a bundle nobody tested.

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: torana-plugins
      # The SDK release these plugins are built and released against, read from
      # the checked-in SDK_REF file. Declaring it as workflow env meant TWO
      # copies — one per workflow — which is the drift this was meant to end.
      - id: sdk_ref
        run: echo "ref=$(cat torana-plugins/SDK_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: torana-edge/torana-plugin-sdk
          # Pinned, not main: a published bundle must be built against an SDK
          # version a user can install and CI has validated. Tracking main meant
          # shipping artifacts linked to unreleased, untested SDK code.
          ref: ${{ steps.sdk_ref.outputs.ref }}
          path: torana-plugin-sdk
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - working-directory: torana-plugins
        run: ./scripts/test.sh
      - working-directory: torana-plugins
        run: ./scripts/package.sh '${{ inputs.plugin }}' '${{ inputs.version }}'
      - uses: anchore/sbom-action@v0
        with:
          path: torana-plugins/dist/${{ inputs.plugin }}
          output-file: torana-plugins/dist/${{ inputs.plugin }}/${{ inputs.plugin }}-${{ inputs.version }}.spdx.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: '${{ inputs.plugin }}/v${{ inputs.version }}'
          files: torana-plugins/dist/${{ inputs.plugin }}/*
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: torana-plugins/dist/${{ inputs.plugin }}/${{ inputs.plugin }}-${{ inputs.version }}.tar.gz
