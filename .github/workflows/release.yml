name: Release plugin

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin directory name
        required: true
      version:
        description: Semver release version
        required: true

# Must match ci.yml. A release built against a different SDK than CI validated
# is a bundle nobody tested.

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: plugin-release-${{ inputs.plugin }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: torana-plugins
      - name: GitHub Actions use immutable commits
        working-directory: torana-plugins
        run: ./scripts/check-actions-pinned.sh
      # Fetch merged SDK history first. The next step validates that SDK_REF is
      # reachable from main before checking it out, so a retained PR/object SHA
      # cannot become an untraceable release dependency.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: torana-edge/torana-plugin-sdk
          ref: main
          fetch-depth: 0
          path: torana-plugin-sdk
      - name: Check out the merged SDK revision
        working-directory: torana-plugins
        run: ./scripts/checkout_sdk_ref.sh ../torana-plugin-sdk
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
      - working-directory: torana-plugins
        run: ./scripts/test.sh
      - working-directory: torana-plugins
        env:
          RELEASE_PLUGIN: ${{ inputs.plugin }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/package.sh "$RELEASE_PLUGIN" "$RELEASE_VERSION"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: torana-plugins/dist/${{ inputs.plugin }}
          output-file: torana-plugins/dist/${{ inputs.plugin }}/${{ inputs.plugin }}-${{ inputs.version }}.spdx.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: '${{ inputs.plugin }}/v${{ inputs.version }}'
          files: torana-plugins/dist/${{ inputs.plugin }}/*
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: torana-plugins/dist/${{ inputs.plugin }}/${{ inputs.plugin }}-${{ inputs.version }}.tar.gz
