name: Release plugin

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin directory name
        required: true
      version:
        description: Semver release version
        required: true

# Must match ci.yml. A release built against a different SDK than CI validated
# is a bundle nobody tested.

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: torana-plugins
      # Fetch merged SDK history first. The next step validates that SDK_REF is
      # reachable from main before checking it out, so a retained PR/object SHA
      # cannot become an untraceable release dependency.
      - uses: actions/checkout@v4
        with:
          repository: torana-edge/torana-plugin-sdk
          ref: main
          fetch-depth: 0
          path: torana-plugin-sdk
      - name: Check out the merged SDK revision
        working-directory: torana-plugins
        run: ./scripts/checkout_sdk_ref.sh ../torana-plugin-sdk
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - working-directory: torana-plugins
        run: ./scripts/test.sh
      - working-directory: torana-plugins
        run: ./scripts/package.sh '${{ inputs.plugin }}' '${{ inputs.version }}'
      - uses: anchore/sbom-action@v0
        with:
          path: torana-plugins/dist/${{ inputs.plugin }}
          output-file: torana-plugins/dist/${{ inputs.plugin }}/${{ inputs.plugin }}-${{ inputs.version }}.spdx.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: '${{ inputs.plugin }}/v${{ inputs.version }}'
          files: torana-plugins/dist/${{ inputs.plugin }}/*
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: torana-plugins/dist/${{ inputs.plugin }}/${{ inputs.plugin }}-${{ inputs.version }}.tar.gz
