name: CI

on:
  pull_request:
  push:
    branches: [main]

# The SDK version these plugins are built and released against. One place, so a
# bump cannot land in CI and miss the release job — which is exactly how
# published bundles ended up built from unreleased SDK code.
env:
  SDK_REF: v0.1.3

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: torana-plugins
      # The SDK is pinned to a release tag: plugins are built against a version
      # a user can actually install, and it moves deliberately at release time.
      - uses: actions/checkout@v4
        with:
          repository: torana-edge/torana-plugin-sdk
          ref: ${{ env.SDK_REF }}
          path: torana-plugin-sdk
      # The proxy tracks main rather than a commit, because the question this
      # job exists to answer is "do these plugins work with the current host".
      # A pinned SHA answers it about a host nobody is running: both refs here
      # were pinned to commits that predated every capability the cache plugins
      # need, so CI was validating compatibility that had stopped being true.
      #
      # The cost is that an unrelated torana-edge change can turn this red. That
      # is the signal, not the noise.
      - uses: actions/checkout@v4
        with:
          repository: torana-edge/torana-edge
          ref: main
          path: torana-edge
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - working-directory: torana-plugins
        run: ./scripts/test.sh
      # Every plugin in the tree, not a hand-maintained list. The list said seven
      # while the repository held nine, so cache_warmer and cache_tier_selector
      # were never built here and never reached the conformance test below — a
      # compile break or a manifest the host rejects would have shipped.
      - working-directory: torana-plugins
        run: |
          for dir in plugins/*/; do
            ./scripts/build.sh "$(basename "$dir")"
          done
      # torana-edge tests the host with fixtures and keeps no copy of these
      # plugins, so its own suite skips every assertion about plugin behaviour.
      # This job is the only place they run. The script fails if they skip
      # rather than run — otherwise a broken gate is indistinguishable from a
      # green build, and pii would stop being tested without anyone noticing.
      - name: Official-plugin behaviour suite
        working-directory: torana-plugins
        run: ./scripts/verify-behaviour.sh ../torana-edge dist
