name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: torana-plugins
      - uses: actions/checkout@v4
        with:
          repository: torana-edge/torana-plugin-sdk
          ref: fc3399a7daa09c1f453da99518bc78a404089c7b
          path: torana-plugin-sdk
      - uses: actions/checkout@v4
        with:
          repository: torana-edge/torana-edge
          ref: c0f19aaa653a87d48c24b28b7febc5055d218be0
          path: torana-edge
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - working-directory: torana-plugins
        run: ./scripts/test.sh
      - working-directory: torana-plugins
        run: |
          for plugin in auth compactor intent keyword_compactor otel pii schema_translator; do
            ./scripts/build.sh "$plugin"
          done
      - working-directory: torana-edge
        run: go test ./internal/plugin -run TestExternalBundlesConformToCurrentHost -count=1
        env:
          TORANA_PLUGIN_BUNDLES_DIR: ${{ github.workspace }}/torana-plugins/dist
