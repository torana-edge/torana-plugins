name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: torana-plugins
      - uses: actions/checkout@v4
        with:
          repository: torana-edge/torana-plugin-sdk
          ref: feat/sdk-v1
          path: torana-plugin-sdk
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - working-directory: torana-plugins
        run: ./scripts/test.sh
      - working-directory: torana-plugins
        run: |
          for plugin in auth compactor intent keyword_compactor otel pii schema_translator; do
            ./scripts/build.sh "$plugin"
          done
