name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: ./scripts/test.sh
      - run: |
          for plugin in auth compactor intent keyword_compactor otel pii schema_translator; do
            ./scripts/build.sh "$plugin"
          done
