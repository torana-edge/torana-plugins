name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: torana-plugins
      - name: GitHub Actions use immutable commits
        working-directory: torana-plugins
        run: ./scripts/check-actions-pinned.sh
      # Fetch merged SDK history first. The next step validates that SDK_REF is
      # reachable from main before checking it out, so a retained PR/object SHA
      # cannot become an untraceable release dependency.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: torana-edge/torana-plugin-sdk
          ref: main
          fetch-depth: 0
          path: torana-plugin-sdk
      - name: Check out the merged SDK revision
        working-directory: torana-plugins
        run: ./scripts/checkout_sdk_ref.sh ../torana-plugin-sdk
      # The proxy tracks main rather than a commit, because the question this
      # job exists to answer is "do these plugins work with the current host".
      # A pinned SHA answers it about a host nobody is running: both refs here
      # were pinned to commits that predated every capability the cache plugins
      # need, so CI was validating compatibility that had stopped being true.
      #
      # The cost is that an unrelated torana-edge change can turn this red. That
      # is the signal, not the noise.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: torana-edge/torana-edge
          ref: main
          path: torana-edge
      # Coordinated host/plugin changes use the same branch name in both
      # repositories. A plugin PR tests that Edge branch when it exists;
      # unrelated PRs and every push to main keep testing Edge main. This avoids
      # a permanent feature-branch pin while still allowing an unmerged
      # cross-repository contract change to prove itself end to end.
      - name: Use coordinated Edge branch when present
        if: github.event_name == 'pull_request'
        working-directory: torana-edge
        run: |
          if git ls-remote --exit-code origin "refs/heads/${GITHUB_HEAD_REF}" >/dev/null; then
            git fetch --depth 1 origin "refs/heads/${GITHUB_HEAD_REF}"
            git checkout --detach FETCH_HEAD
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # This job compiles torana-edge's real fixtures with GOTOOLCHAIN=local.
          # Resolve the exact version from the host checkout instead of a minor
          # wildcard: setup-go's manifest can lag a new patch release, which
          # previously selected 1.26.5 after Edge required 1.26.6.
          go-version-file: torana-edge/go.mod
      - working-directory: torana-plugins
        run: ./scripts/test.sh
      - name: Vet every plugin module
        working-directory: torana-plugins
        run: |
          for dir in plugins/*/; do
            (cd "$dir" && GOWORK=off go vet ./...)
          done
      - name: Race detector for every plugin module
        working-directory: torana-plugins
        run: |
          for dir in plugins/*/; do
            (cd "$dir" && GOWORK=off go test -race ./...)
          done
      - name: golangci-lint every plugin module
        working-directory: torana-plugins
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          for dir in plugins/*/; do
            (cd "$dir" && GOWORK=off golangci-lint run --config ../../.golangci.yml --timeout 5m)
          done
      - name: Vulnerability scan every plugin module
        working-directory: torana-plugins
        run: |
          for dir in plugins/*/; do
            (cd "$dir" && go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)
          done
      # Every plugin in the tree, not a hand-maintained list. The list said seven
      # while the repository held nine, so cache_warmer and cache_tier_selector
      # were never built here and never reached the conformance test below — a
      # compile break or a manifest the host rejects would have shipped.
      - working-directory: torana-plugins
        run: |
          for dir in plugins/*/; do
            ./scripts/build.sh "$(basename "$dir")"
          done
      # torana-edge tests the host with fixtures and keeps no copy of these
      # plugins, so its own suite skips every assertion about plugin behaviour.
      # This job is the only place they run. The script fails if they skip
      # rather than run — otherwise a broken gate is indistinguishable from a
      # green build, and pii would stop being tested without anyone noticing.
      - name: Official-plugin behaviour suite
        working-directory: torana-plugins
        run: ./scripts/verify-behaviour.sh ../torana-edge dist
      # Torana binds an operator's approval to a digest over the bundle. If the
      # same source can produce two different .wasm files, reinstalling
      # identical code invalidates that approval, and an operator who reapproves
      # out of habit is trained to click through the one control protecting
      # them. This builds each plugin from two different directories, because
      # the build path is the variable that matters — building twice from one
      # path agrees with itself whether or not -trimpath is passed.
      - name: Reproducible plugin digests
        working-directory: torana-plugins
        run: ./scripts/verify-reproducible.sh
